# TrafficMind AI - migration staging services
# Existing Vercel and Render production services remain untouched.

services:
  - type: web
    name: trafficmind-ai-api-migration
    branch: render-migration
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ORS_API_KEY
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: INTERNAL_AI_KEY
        generateValue: true
      - key: FRONTEND_URL
        fromService:
          name: trafficmind-ai-web-migration
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: trafficmind-ai-web-migration
    branch: render-migration
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: "off"
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          name: trafficmind-ai-api-migration
          type: web
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
